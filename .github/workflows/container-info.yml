name: Container Info

on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.container-info.outputs.image }}

env:
  CONTAINER_IMAGE_REGISTRY: ghcr.io
  CONTAINER_IMAGE_REPO: imgproxy/imgproxy-base
  CONTAINER_IMAGE_TAG: v4.1.4

jobs:
  container-info:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.container-info.outputs.image }}
    steps:
      # GitHub Actions doesn't provide a way to define a constant in a file and
      # share it across workflows.
      # So we have to use this dummy step that just maps environment variables
      # to the output.
      - name: Container Info
        id: container-info
        run: |
          echo "registry=${{ env.CONTAINER_IMAGE_REGISTRY }}" >> $GITHUB_OUTPUT
          echo "repo=${{ env.CONTAINER_IMAGE_REPO }}" >> $GITHUB_OUTPUT
          echo "tag=${{ env.CONTAINER_IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.CONTAINER_IMAGE_REGISTRY }}/${{ env.CONTAINER_IMAGE_REPO }}:${{ env.CONTAINER_IMAGE_TAG }}" >> $GITHUB_OUTPUT
