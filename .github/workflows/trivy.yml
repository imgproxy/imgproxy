name: Trivy (Docker image scan)

on:
  workflow_call:
    inputs:
      container_image:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.container_image }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          cache: "false"

      # Renders the JSON report from the scan above back into the same table
      # format the old table-format scan produced, without rescanning.
      - name: Write scan results to job summary
        if: always()
        run: |
          {
            echo "### Trivy scan: ${{ inputs.container_image }}"
            echo '```'
            trivy convert --format table trivy-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical vulnerabilities
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-report.json)
          if [ "$count" -gt 0 ]; then
            echo "Found $count CRITICAL/HIGH severity vulnerabilit(y/ies) — see job summary." >&2
            exit 1
          fi
