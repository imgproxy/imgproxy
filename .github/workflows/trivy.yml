name: Trivy (Docker image scan)

on:
  workflow_call:
    inputs:
      container_image:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # TEMPORARY: published images still ship go-jose v4.1.4. Fixed on
      # version/4.0 in 9204012b (v4.1.7). Remove this step and the
      # trivyignores input below once the next release image is published.
      # Entries expire on their own via expired_at.
      - name: Write temporary Trivy ignore file
        run: |
          cat > "$RUNNER_TEMP/trivyignore.yaml" <<'YAML'
          vulnerabilities:
            - id: CVE-2026-116587
              statement: go-jose fixed in v4.1.7, waiting for release
              expired_at: 2026-11-16
            - id: CVE-2026-116586
              statement: go-jose fixed in v4.1.7, waiting for release
              expired_at: 2026-11-16
            - id: CVE-2026-116585
              statement: go-jose fixed in v4.1.7, waiting for release
              expired_at: 2026-11-16
          YAML

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.container_image }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          cache: "false"
          trivyignores: ${{ runner.temp }}/trivyignore.yaml

      # Renders the JSON report from the scan above back into the same table
      # format the old table-format scan produced, without rescanning.
      - name: Write scan results to job summary
        if: always()
        run: |
          {
            echo "### Trivy scan: ${{ inputs.container_image }}"
            echo '```'
            trivy convert --format table trivy-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical vulnerabilities
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-report.json)
          if [ "$count" -gt 0 ]; then
            echo "Found $count CRITICAL/HIGH severity vulnerabilit(y/ies) — see job summary." >&2
            exit 1
          fi
